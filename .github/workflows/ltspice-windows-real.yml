name: Real LTspice Windows smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-ltspice-windows
  cancel-in-progress: false

jobs:
  real-ltspice:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      LTSPICE_VERSION: 26.0.2
      LTSPICE_MSI_SHA256: 485dabd2d7d8293de733a399719f6538efda4a54b48b181a14e07271186984d3
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download and verify official LTspice installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://ltspice.analog.com/download/$env:LTSPICE_VERSION/LTspice64.msi"
          $msi = Join-Path $env:RUNNER_TEMP "LTspice64-$env:LTSPICE_VERSION.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash.ToLowerInvariant()
          if ($actual -ne $env:LTSPICE_MSI_SHA256) {
            throw "LTspice MSI SHA-256 mismatch: expected $env:LTSPICE_MSI_SHA256, got $actual"
          }
          "LTSPICE_MSI=$msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install LTspice silently
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $log = Join-Path $env:RUNNER_TEMP "ltspice-install.log"
          $process = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @(
            "/i", "`"$env:LTSPICE_MSI`"", "/qn", "/norestart", "/L*v", "`"$log`""
          )
          if ($process.ExitCode -notin 0, 3010) {
            throw "LTspice MSI failed with exit code $($process.ExitCode)"
          }
          $roots = @(
            (Join-Path $env:LOCALAPPDATA "Programs"),
            $env:ProgramFiles,
            ${env:ProgramFiles(x86)}
          ) | Where-Object { $_ -and (Test-Path $_) }
          $executable = Get-ChildItem -Path $roots -Filter LTspice.exe -File -Recurse |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $executable) {
            throw "LTspice.exe was not found after installation"
          }
          "LTSPICE_EXECUTABLE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Append
          "REAL_LTSPICE_EVIDENCE_DIR=$env:RUNNER_TEMP\ltspice-real-smoke" |
            Out-File -FilePath $env:GITHUB_ENV -Append
          (Get-Item $executable).VersionInfo |
            Select-Object FileVersion, ProductVersion, FileDescription

      - name: Decline first-run usage-data sharing
        shell: pwsh
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName UIAutomationClient
          Add-Type -AssemblyName UIAutomationTypes
          Add-Type -AssemblyName System.Drawing
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class NativeMouse {
              [DllImport("user32.dll")]
              public static extern bool SetForegroundWindow(IntPtr window);
              [DllImport("user32.dll")]
              public static extern bool SetCursorPos(int x, int y);
              [DllImport("user32.dll")]
              private static extern void mouse_event(
                  uint flags, uint dx, uint dy, uint data, UIntPtr extraInfo
              );
              public static void Click(int x, int y) {
                  SetCursorPos(x, y);
                  mouse_event(0x0002, 0, 0, 0, UIntPtr.Zero);
                  mouse_event(0x0004, 0, 0, 0, UIntPtr.Zero);
              }
          }
          '@
          $process = Start-Process $env:LTSPICE_EXECUTABLE -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $declined = $false
          while ((Get-Date) -lt $deadline -and -not $declined) {
            Start-Sleep -Milliseconds 250
            $process.Refresh()
            if ($process.HasExited) {
              continue
            }
            $windows = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
              [System.Windows.Automation.TreeScope]::Children,
              [System.Windows.Automation.Condition]::TrueCondition
            ) | Where-Object {
              $_.Current.ProcessId -eq $process.Id
            }
            foreach ($window in $windows) {
              Write-Host "LTspice window: $($window.Current.Name)"
              if ($window.Current.Name -eq "Anonymously Share LTspice Usage Data") {
                $bounds = $window.Current.BoundingRectangle
                $bitmap = [System.Drawing.Bitmap]::new(
                  [int]$bounds.Width, [int]$bounds.Height
                )
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                $graphics.CopyFromScreen(
                  [int]$bounds.X,
                  [int]$bounds.Y,
                  0,
                  0,
                  $bitmap.Size
                )
                $screenshot = Join-Path $env:RUNNER_TEMP "ltspice-first-run.png"
                $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
                $graphics.Dispose()
                $bitmap.Dispose()
                [NativeMouse]::SetForegroundWindow(
                  [IntPtr]$window.Current.NativeWindowHandle
                )
                [NativeMouse]::Click(
                  [int]($bounds.X + $bounds.Width * 40 / 445),
                  [int]($bounds.Y + $bounds.Height * 132 / 227)
                )
                Start-Sleep -Milliseconds 200
                [NativeMouse]::Click(
                  [int]($bounds.X + $bounds.Width * 383 / 445),
                  [int]($bounds.Y + $bounds.Height * 196 / 227)
                )
                Start-Sleep -Seconds 1
                $remaining = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
                  [System.Windows.Automation.TreeScope]::Children,
                  [System.Windows.Automation.Condition]::TrueCondition
                ) | Where-Object {
                  $_.Current.ProcessId -eq $process.Id -and
                  $_.Current.Name -eq "Anonymously Share LTspice Usage Data"
                }
                if ($remaining.Count -ne 0) {
                  throw "LTspice usage-data dialog did not close after selecting No"
                }
                $declined = $true
                break
              }
            }
          }
          if (-not $declined) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "LTspice first-run usage-data dialog was not found"
          }
          Start-Sleep -Seconds 2
          $process.Refresh()
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Run bounded real simulator verification
        shell: pwsh
        timeout-minutes: 3
        run: python tests/real_ltspice_smoke.py

      - name: Upload compact verification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: real-ltspice-windows-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/ltspice-install.log
            ${{ runner.temp }}/ltspice-first-run.png
            ${{ runner.temp }}/ltspice-real-smoke/run_manifest.json
            ${{ runner.temp }}/ltspice-real-smoke/rc_lowpass.log
            ${{ runner.temp }}/ltspice-real-smoke/rc_lowpass.raw
            ${{ runner.temp }}/ltspice-real-smoke/smoke_summary.json
