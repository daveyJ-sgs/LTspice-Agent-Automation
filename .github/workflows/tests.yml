name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-mcp.txt
            requirements-gui.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements.txt -r requirements-mcp.txt -r requirements-gui.txt -r requirements-dev.txt
      - run: >-
          python -m ruff check
          artifacts.py adaptive_boundary.py experiment_engine.py experiment_index.py
          frequency_domain_metrics.py
          optimization_comparison.py optimization_engine.py optimization_recipe.py
          optimization_study.py robust_selection.py statistical_comparison.py
          statistical_engine.py study_recipe.py system_builder.py system_builder_routes
          waveform_metrics.py tests/support.py tests/test_artifacts.py
          tests/test_documentation.py tests/test_frequency_domain_metrics.py tests/test_system_builder.py
          tests/test_waveform_metrics.py
      - run: python -m mypy artifacts.py waveform_metrics.py frequency_domain_metrics.py
      - run: python -m unittest discover -s tests -v
      - name: Qualify MCP stdio client on Windows
        if: runner.os == 'Windows'
        run: python tests/stdio_mcp_client_smoke.py
